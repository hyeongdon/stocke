<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>기본적분석</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stocke">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#131720">
  <link rel="stylesheet" href="/static/dashboard.css?v=64">
  <link rel="stylesheet" href="/static/analysis.css?v=16">
  <script src="/static/theme-sync.js?v=1"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>기본적분석</h1>
        <span class="sub">네이버 시가총액 마트 · PER · PBR · ROE</span>
      </div>
      <nav class="tabs">
        <a href="/dashboard" class="tab">대시보드</a>
        <a href="/ladder" class="tab-link">분할매수 ↗</a>
        <a href="/analysis" class="tab active">분석</a>
        <a href="/theme-map" class="tab-link">테마맵 ↗</a>
        <a href="/verify" class="tab-link">검증 ↗</a>
        <a href="/api-explorer" class="tab-link">API ↗</a>
        <a href="/exit-replay" class="tab-link">청산 시뮬 ↗</a>
        <a href="/static/glossary.html" class="tab-link">용어정리 ↗</a>
      </nav>
      <div class="topbar-actions analysis-filters">
        <input type="search" id="codeSearch" class="analysis-search" placeholder="종목코드" maxlength="6" inputmode="numeric" autocomplete="off" enterkeyhint="search">
        <button class="btn sm primary" id="btnRefresh" type="button">새로고침</button>
        <span class="updated">갱신: <span id="lastUpdated">-</span></span>
      </div>
    </div>
  </header>

  <div class="wrap analysis-wrap">
    <section class="analysis-summary" id="summaryCards">
      <div class="v-stat"><div class="k">총 종목</div><div class="v" id="statTotal">-</div></div>
      <div class="v-stat"><div class="k">기준일</div><div class="v" id="statDate">-</div></div>
      <div class="v-stat"><div class="k">KOSPI</div><div class="v" id="statKospi">-</div></div>
      <div class="v-stat"><div class="k">KOSDAQ</div><div class="v" id="statKosdaq">-</div></div>
      <div class="v-stat"><div class="k">표시 건수</div><div class="v" id="statShown">-</div></div>
    </section>

    <div class="card analysis-toolbar-card">
      <button type="button" class="analysis-filter-toggle" id="btnFilterToggle" aria-expanded="false" aria-controls="filterPanel">
        <span class="analysis-filter-toggle-label">필터</span>
        <span class="analysis-filter-summary" id="filterSummary">전체 · 시가총액 · 시총≥1천억</span>
        <span class="analysis-filter-chevron" aria-hidden="true"></span>
      </button>
      <div class="card-body analysis-toolbar" id="filterPanel">
        <label>시장
          <select id="fltMarket">
            <option value="">전체</option>
            <option value="KOSPI">KOSPI</option>
            <option value="KOSDAQ">KOSDAQ</option>
          </select>
        </label>
        <label>정렬
          <select id="fltSortBy">
            <option value="market_cap">시가총액</option>
            <option value="per">PER</option>
            <option value="pbr">PBR</option>
            <option value="roe">ROE</option>
            <option value="current_price">현재가</option>
            <option value="revenue">매출</option>
            <option value="operating_profit">영업이익</option>
            <option value="foreign_ratio">외국인비율</option>
            <option value="stock_code">종목코드</option>
            <option value="stock_name">종목명</option>
          </select>
        </label>
        <label>표시
          <select id="fltLimit">
            <option value="100">100</option>
            <option value="200">200</option>
            <option value="500">500</option>
            <option value="1000" selected>1000</option>
            <option value="2000">2000</option>
          </select>
        </label>
        <label title="시가총액 하한 (억원). 1000 = 1천억">시총(억) ≥<input type="number" id="fltMinCap" value="1000" placeholder="예: 1000" step="100" min="0"></label>
        <label>PER ≤<input type="number" id="fltMaxPer" placeholder="예: 15" step="0.1" min="0"></label>
        <label>PBR ≤<input type="number" id="fltMaxPbr" placeholder="예: 2" step="0.1" min="0"></label>
        <label>ROE ≥<input type="number" id="fltMinRoe" placeholder="예: 10" step="0.1"></label>
        <label class="analysis-check" title="키움 조건식(주봉RSI) 결과 종목만 (해제 시 마지막 조회 결과를 '주RSI' 배지로 표시)"><input type="checkbox" id="fltWeeklyRsiOnly">주봉RSI</label>
        <label class="analysis-check" title="키움 조건식(일봉RSI) 결과 종목만 (해제 시 마지막 조회 결과를 '일RSI' 배지로 표시)"><input type="checkbox" id="fltDailyRsiOnly">일봉RSI</label>
        <label class="analysis-check" title="키움 조건식(주봉윌리암) 결과 종목만 (해제 시 마지막 조회 결과를 '주WR' 배지로 표시)"><input type="checkbox" id="fltWeeklyWilliamsOnly">주봉윌리암</label>
        <label class="analysis-check" title="키움 조건식(일봉윌리암) 결과 종목만 (해제 시 마지막 조회 결과를 '일WR' 배지로 표시)"><input type="checkbox" id="fltDailyWilliamsOnly">일봉윌리암</label>
        <label class="analysis-check" title="키움 조건식(밥그릇) 결과 종목만 (해제 시 마지막 조회 결과를 '밥그릇' 배지로 표시)"><input type="checkbox" id="fltBowlOnly">밥그릇</label>
        <label class="analysis-check" title="키움 조건식(2060돌파) 결과 종목만 — 20일·60일 이평 골든크로스 (해제 시 마지막 조회 결과를 '2060' 배지로 표시)"><input type="checkbox" id="fltMa2060Only">2060돌파</label>
        <label class="analysis-check" title="키움 조건식(코스피추세이탈·코스닥추세이탈) 결과 종목 제외 (해제 시 마지막 조회 결과를 '추세이탈' 배지로 표시)"><input type="checkbox" id="fltExcludeBelowMa60">추세이탈 제외</label>
        <span class="hint" id="conditionSetInfo"></span>
        <div class="analysis-toolbar-actions">
          <button class="btn sm" id="btnApply" type="button">필터 적용</button>
          <button class="btn sm" id="btnReset" type="button">초기화</button>
        </div>
      </div>
    </div>

    <div id="emptyBanner" class="analysis-banner" style="display:none;"></div>

    <div class="grid cols-2 analysis-main-grid" id="mainGrid">
      <div class="card analysis-table-card">
        <div class="card-head">
          <h3>종목 목록 <span class="hint" id="tableHint"></span></h3>
          <button class="btn sm analysis-sort-dir" id="btnSortDir" type="button" aria-pressed="true">내림차순</button>
        </div>
        <div class="card-body analysis-table-wrap" id="tableWrap">
          <div class="skeleton">데이터 불러오는 중…</div>
        </div>
      </div>
      <div class="card analysis-detail-card" id="detailCard">
        <div class="card-head">
          <h3 id="detailTitle">종목 상세</h3>
          <div class="analysis-detail-head-side">
            <span class="hint" id="detailHint">목록에서 종목을 고르거나 코드를 검색하세요</span>
            <button class="btn sm analysis-back-list" id="btnBackList" type="button">목록</button>
          </div>
        </div>
        <div class="card-body" id="detailBody">
          <div class="empty"><span class="ico">📊</span>목록에서 종목을 선택하면 상세 지표가 표시됩니다.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/static/analysis.js?v=25"></script>
</body>
</html>
