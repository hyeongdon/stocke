<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>기본적분석</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stocke">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#131720">
  <link rel="stylesheet" href="/static/dashboard.css?v=153">
  <link rel="stylesheet" href="/static/analysis.css?v=33">
  <script src="/static/theme-sync.js?v=3"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-head">
        <div class="brand">
          <a class="brand-home" href="/" aria-label="인덱스 페이지"><h1>stock</h1></a>
        </div>
      </div>
      <nav class="tabs tabs-scroll" aria-label="메인 메뉴">
        <a href="/static/dashboard.html?tab=trading" class="tab-link">트레이딩</a>
        <a href="/static/dashboard.html?tab=board" class="tab-link">대시보드</a>
        <a href="/analysis" class="tab-link active" aria-current="page">분석 ↗</a>
        <a href="/static/dashboard.html?tab=settings" class="tab-link">설정</a>
      </nav>
      <div class="topbar-actions analysis-filters" hidden>
        <input type="search" id="codeSearch" class="analysis-search" placeholder="종목코드/종목명" maxlength="30" autocomplete="off" enterkeyhint="search" list="codeSearchList">
        <datalist id="codeSearchList"></datalist>
        <button class="btn sm primary" id="btnRefresh" type="button">새로고침</button>
        <span class="updated">갱신: <span id="lastUpdated">-</span></span>
      </div>
    </div>
  </header>

  <div class="auto-subtabs-bar analysis-view-bar">
    <nav class="auto-subtabs" aria-label="분석 하위 메뉴">
      <button type="button" class="auto-subtab analysis-view-tab active" data-view="chart">차트</button>
      <button type="button" class="auto-subtab analysis-view-tab" data-view="fundamental">기본적분석</button>
      <button type="button" class="auto-subtab analysis-view-tab" data-view="theme">테마</button>
      <button type="button" class="auto-subtab analysis-view-tab" data-view="indicators">지표</button>
    </nav>
  </div>

  <div class="analysis-view" id="analysis-view-chart">
    <iframe class="analysis-embed-frame" title="차트" data-src="/static/chart_orderbook.html?embed=1&v=21"></iframe>
  </div>
  <div class="analysis-view" id="analysis-view-theme" hidden>
    <iframe class="analysis-embed-frame" title="테마" data-src="/static/theme_map.html?embed=1"></iframe>
  </div>
  <div class="analysis-view" id="analysis-view-indicators" hidden>
    <iframe class="analysis-embed-frame" title="지표" data-src="/static/indicators.html?embed=1"></iframe>
  </div>

  <div class="wrap analysis-wrap analysis-view" id="analysis-view-fundamental" hidden>
    <section class="analysis-summary" id="summaryCards">
      <div class="v-stat"><div class="k">총 종목</div><div class="v" id="statTotal">-</div></div>
      <div class="v-stat"><div class="k">기준일</div><div class="v" id="statDate">-</div></div>
      <div class="v-stat"><div class="k">KOSPI</div><div class="v" id="statKospi">-</div></div>
      <div class="v-stat"><div class="k">KOSDAQ</div><div class="v" id="statKosdaq">-</div></div>
      <div class="v-stat"><div class="k">표시 건수</div><div class="v" id="statShown">-</div></div>
    </section>

    <div class="card analysis-toolbar-card">
      <div class="analysis-filter-bar">
        <button type="button" class="analysis-filter-toggle" id="btnFilterToggle" aria-expanded="false" aria-controls="filterPanel">
          <span class="analysis-filter-toggle-label">필터</span>
          <span class="analysis-filter-summary" id="filterSummary">전체 · 시가총액 · 시총≥1천억</span>
          <span class="analysis-filter-chevron" aria-hidden="true"></span>
        </button>
        <button type="button" class="analysis-favorites-quick" id="btnFavoritesQuick" aria-pressed="false" title="즐겨찾기만 보기" aria-label="즐겨찾기만 보기">
          <span class="analysis-favorites-quick-icon" aria-hidden="true">★</span>
          <span class="analysis-favorites-quick-count" id="favoritesQuickCount"></span>
        </button>
      </div>
      <div class="card-body analysis-toolbar" id="filterPanel">
        <label>시장
          <select id="fltMarket">
            <option value="">전체</option>
            <option value="KOSPI">KOSPI</option>
            <option value="KOSDAQ">KOSDAQ</option>
          </select>
        </label>
        <label>정렬
          <select id="fltSortBy">
            <option value="market_cap">시가총액</option>
            <option value="per">PER</option>
            <option value="pbr">PBR</option>
            <option value="roe">ROE</option>
            <option value="current_price">현재가</option>
            <option value="revenue">매출</option>
            <option value="operating_profit">영업이익</option>
            <option value="foreign_ratio">외국인비율</option>
            <option value="stock_name">종목명</option>
          </select>
        </label>
        <label>표시
          <select id="fltLimit">
            <option value="100">100</option>
            <option value="200">200</option>
            <option value="500">500</option>
            <option value="1000" selected>1000</option>
            <option value="2000">2000</option>
          </select>
        </label>
        <label title="시가총액 하한 (억원). 1000 = 1천억">시총(억) ≥<input type="number" id="fltMinCap" value="1000" placeholder="예: 1000" step="100" min="0"></label>
        <label>PER ≤<input type="number" id="fltMaxPer" placeholder="예: 15" step="0.1" min="0"></label>
        <label>PBR ≤<input type="number" id="fltMaxPbr" placeholder="예: 2" step="0.1" min="0"></label>
        <label>ROE ≥<input type="number" id="fltMinRoe" placeholder="예: 10" step="0.1"></label>
        <label class="analysis-check" title="키움 조건식(주봉RSI) 결과 종목만 (해제 시 마지막 조회 결과를 '주RSI' 배지로 표시)"><input type="checkbox" id="fltWeeklyRsiOnly">주봉RSI</label>
        <label class="analysis-check" title="키움 조건식(일봉RSI) 결과 종목만 (해제 시 마지막 조회 결과를 '일RSI' 배지로 표시)"><input type="checkbox" id="fltDailyRsiOnly">일봉RSI</label>
        <label class="analysis-check" title="키움 조건식(주봉윌리암) 결과 종목만 (해제 시 마지막 조회 결과를 '주WR' 배지로 표시)"><input type="checkbox" id="fltWeeklyWilliamsOnly">주봉윌리암</label>
        <label class="analysis-check" title="키움 조건식(일봉윌리암) 결과 종목만 (해제 시 마지막 조회 결과를 '일WR' 배지로 표시)"><input type="checkbox" id="fltDailyWilliamsOnly">일봉윌리암</label>
        <label class="analysis-check" title="키움 조건식(밥그릇) 결과 종목만 (해제 시 마지막 조회 결과를 '밥그릇' 배지로 표시)"><input type="checkbox" id="fltBowlOnly">밥그릇</label>
        <label class="analysis-check" title="키움 조건식(2060돌파) 결과 종목만 — 20일·60일 이평 골든크로스 (해제 시 마지막 조회 결과를 '2060' 배지로 표시)"><input type="checkbox" id="fltMa2060Only">2060돌파</label>
        <label class="analysis-check" title="키움 조건식(2060돌파임박) 결과 종목만 — 20일·60일 이평 골든크로스 임박 (해제 시 마지막 조회 결과를 '2060임박' 배지로 표시)"><input type="checkbox" id="fltMa2060SoonOnly">2060돌파임박</label>
        <label class="analysis-check" title="키움 조건식(코스피추세이탈·코스닥추세이탈) 결과 종목 제외 (해제 시 마지막 조회 결과를 '추세이탈' 배지로 표시)"><input type="checkbox" id="fltExcludeBelowMa60">추세이탈 제외</label>
        <label class="analysis-check" title="즐겨찾기에 등록한 종목만 표시"><input type="checkbox" id="fltFavoritesOnly">즐겨찾기만</label>
        <label id="fltFavoriteFolderWrap" class="analysis-fav-folder-wrap" hidden title="즐겨찾기 폴더 선택">폴더
          <select id="fltFavoriteFolder" aria-label="즐겨찾기 폴더">
            <option value="">전체 폴더</option>
            <option value="none">미분류</option>
          </select>
        </label>
        <span class="hint" id="conditionSetInfo"></span>
        <div class="analysis-toolbar-actions">
          <button class="btn sm" id="btnApply" type="button">필터 적용</button>
          <button class="btn sm" id="btnReset" type="button">초기화</button>
        </div>
      </div>
    </div>

    <div id="emptyBanner" class="analysis-banner" style="display:none;"></div>

    <div class="grid cols-2 analysis-main-grid" id="mainGrid">
      <div class="card analysis-table-card">
        <div class="card-head">
          <h3>종목 목록 <span class="hint" id="tableHint"></span></h3>
          <button class="btn sm analysis-sort-dir" id="btnSortDir" type="button" aria-pressed="true">내림차순</button>
        </div>
        <div class="card-body analysis-table-wrap" id="tableWrap">
          <div class="skeleton">데이터 불러오는 중…</div>
        </div>
      </div>
      <div class="card analysis-detail-card" id="detailCard">
        <div class="card-head">
          <div class="analysis-detail-title">
            <h3 id="detailTitle">종목 상세</h3>
            <div class="analysis-detail-themes" id="detailThemes" aria-live="polite"></div>
          </div>
          <div class="analysis-detail-head-side">
            <span class="hint" id="detailHint">목록에서 종목을 고르거나 코드를 검색하세요</span>
            <button class="btn sm analysis-back-list" id="btnBackList" type="button">목록</button>
          </div>
        </div>
        <div class="card-body" id="detailBody">
          <div class="empty"><span class="ico">📊</span>목록에서 종목을 선택하면 상세 지표가 표시됩니다.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/static/investor-history.js?v=8"></script>
  <script src="/static/analysis.js?v=46"></script>
  <script src="/static/telegram-price-alert.js?v=2"></script>
  <script>
    (function () {
      const filters = document.querySelector('.analysis-filters');
      const EMBED_VIEWS = new Set(['chart', 'theme', 'indicators']);
      function embedSrc(base) {
        const code = new URLSearchParams(location.search).get('code') || '';
        if (!code || !/^\d{1,6}$/.test(code)) return base;
        const u = new URL(base, location.origin);
        u.searchParams.set('code', code.padStart(6, '0'));
        return u.pathname + u.search;
      }
      function showView(name) {
        document.querySelectorAll('.analysis-view-tab').forEach((t) => {
          t.classList.toggle('active', t.dataset.view === name);
        });
        document.querySelectorAll('.analysis-view').forEach((v) => {
          v.hidden = v.id !== 'analysis-view-' + name;
        });
        if (filters) filters.hidden = name !== 'fundamental';
        const frame = document.querySelector('#analysis-view-' + name + ' iframe');
        if (frame) {
          const next = embedSrc(frame.dataset.src);
          const cur = frame.getAttribute('src');
          if (!cur) {
            frame.src = next;
          } else if (name === 'chart') {
            try {
              const curCode = new URL(cur, location.origin).searchParams.get('code') || '';
              const wantCode = new URLSearchParams(location.search).get('code') || '';
              const norm = (c) => (/^\d{1,6}$/.test(c) ? c.padStart(6, '0') : '');
              if (norm(wantCode) && norm(wantCode) !== norm(curCode)) frame.src = next;
            } catch (_) { /* ignore */ }
          }
        }
        const url = new URL(location.href);
        if (name === 'chart') url.searchParams.delete('view');
        else url.searchParams.set('view', name);
        history.replaceState(null, '', url);
      }
      document.querySelectorAll('.analysis-view-tab').forEach((t) => {
        t.addEventListener('click', () => showView(t.dataset.view));
      });
      const initial = new URLSearchParams(location.search).get('view') || 'chart';
      if (initial === 'fundamental') showView('fundamental');
      else if (EMBED_VIEWS.has(initial)) showView(initial);
      else showView('chart');
    })();
  </script>
</body>
</html>
